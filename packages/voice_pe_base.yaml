# ==============================================================================
# VOICE PE BASE PACKAGE
# ==============================================================================
# Hardware-specific configuration for Home Assistant Voice Preview Edition.
# This package handles the XMOS voice processor, AIC3204 DAC, LED ring,
# and physical controls (rotary encoder, mute switch, button).
#
# The XMOS processor handles echo cancellation and noise suppression in
# hardware, so no software AEC is needed.
#
# Include this package in intercom-voice-pe.yaml:
#
#   packages:
#     voice_pe: !include packages/voice_pe_base.yaml
#     base: !include packages/intercom_base.yaml
#
# ==============================================================================

# ==============================================================================
# EXTERNAL COMPONENTS - Voice PE specific
# ==============================================================================
external_components:
  # Voice Kit component from official ESPHome Voice PE repo (for XMOS control)
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: dev
    components: [voice_kit]

# ==============================================================================
# GLOBALS - Volume display state
# ==============================================================================
globals:
  - id: volume_display_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: led_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

# ==============================================================================
# SCRIPTS - LED control
# ==============================================================================
script:
  # Initialize LED ring to idle state
  - id: init_led_ring
    mode: single
    then:
      - switch.turn_on: led_power_switch
      - delay: 500ms
      - light.turn_on:
          id: status_led
          brightness: 30%
          effect: "Breathing Blue"
      - lambda: 'id(led_initialized) = true;'
      - logger.log:
          level: INFO
          format: "LED ring initialized"

  # Override to enable speaker amplifier for ringtone
  - id: !extend enable_speaker_for_ringtone
    then:
      - output.turn_on: speaker_enable_pin
      - logger.log: "Speaker amplifier enabled for ringtone"

  - id: show_volume_on_leds
    mode: restart
    then:
      - logger.log: "show_volume_on_leds script triggered"
      - if:
          condition:
            lambda: 'return id(led_initialized);'
          then:
            - logger.log: "LED initialized, showing volume"
            - lambda: 'id(volume_display_active) = true;'
            - light.turn_on:
                id: status_led
                brightness: 80%
                effect: "Volume Display"
            - delay: 2s
            - lambda: 'id(volume_display_active) = false;'
            # Return to normal state based on call_state
            - lambda: |-
                if (id(call_state) == 0) {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(0.3f);
                  call.set_rgb(0.0f, 0.0f, 1.0f);
                  call.set_effect("Breathing Blue");
                  call.perform();
                } else if (id(call_state) == 3) {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(0.8f);
                  call.set_effect("In Call");
                  call.perform();
                }

# ==============================================================================
# I2C BUS (shared by XMOS and AIC3204)
# ==============================================================================
i2c:
  - id: i2c_bus
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz
    scan: false

# ==============================================================================
# XMOS VOICE PROCESSOR
# Handles AEC, noise suppression, interference cancellation, and AGC
# ==============================================================================
voice_kit:
  id: voice_kit_xmos
  i2c_id: i2c_bus
  reset_pin: GPIO4
  # XMOS firmware will be auto-updated if version mismatch detected

# ==============================================================================
# AIC3204 AUDIO DAC - REQUIRED for speaker output!
# The AIC3204 must be initialized via I2C before audio will play
# ==============================================================================
audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: i2c_bus

# ==============================================================================
# I2S AUDIO CONFIGURATION - Dual Bus Setup
# Voice PE uses SEPARATE I2S interfaces for mic and speaker
# ==============================================================================
i2s_audio:
  # Microphone input (ESP32 is SLAVE - XMOS provides clock)
  - id: i2s_mic
    i2s_lrclk_pin: GPIO14
    i2s_bclk_pin: GPIO13

  # Speaker output (ESP32 is SLAVE - XMOS provides clock for both)
  - id: i2s_spk
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

# ==============================================================================
# MICROPHONE - From XMOS processed output
# ==============================================================================
microphone:
  - platform: i2s_audio
    id: mic_xmos
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO15
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left
    i2s_mode: secondary  # ESP32 is slave, XMOS provides clock

# ==============================================================================
# SPEAKER - To AIC3204 DAC
# Hardware runs at 48kHz, but intercom audio is 16kHz.
# The intercom_audio component calls set_audio_stream_info() to tell the
# speaker component what rate the incoming audio is, and ESPHome handles
# the resampling automatically.
# ==============================================================================
speaker:
  - platform: i2s_audio
    id: spk_aic3204
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO10
    dac_type: external
    sample_rate: 48000  # Hardware rate (AIC3204)
    bits_per_sample: 32bit
    channel: stereo
    i2s_mode: secondary  # ESP32 is slave - XMOS provides clock
    timeout: 100ms
    buffer_duration: 100ms

# Speaker amplifier enable
output:
  - platform: gpio
    id: speaker_enable_pin
    pin: GPIO47

# LED ring power enable (directly managed by switch below)

# ==============================================================================
# LED RING (12 RGB LEDs on GPIO21, power on GPIO45)
# ==============================================================================
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "LED Ring"
    icon: "mdi:led-on"
    pin: GPIO21
    chipset: WS2812
    num_leds: 12
    rgb_order: GRB
    default_transition_length: 100ms
    effects:
      # Idle - gentle blue breathing (addressable version for LED strip)
      - addressable_lambda:
          name: "Breathing Blue"
          update_interval: 50ms
          lambda: |-
            static uint16_t phase = 0;
            phase = (phase + 1) % 200;  // 200 steps = 10 seconds cycle at 50ms
            // Calculate brightness: sine wave between 0.1 and 0.4
            float brightness = 0.1f + 0.15f * (1.0f + sin(phase * 3.14159f / 100.0f));
            uint8_t blue = (uint8_t)(brightness * 255);
            uint8_t dim_blue = blue / 3;  // Slight tint
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, dim_blue, blue);
            }
      # Ringing - red spinning
      - addressable_rainbow:
          name: "Ringing"
          speed: 30
          width: 12
      - strobe:
          name: "Ringing Flash"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 300ms
            - state: false
              duration: 300ms
      # Calling out - orange pulse
      - strobe:
          name: "Calling"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 50%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
      # In call - solid green
      - addressable_lambda:
          name: "In Call"
          update_interval: 100ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, 180, 0);
            }
      # Processing/thinking - cyan spinner
      - addressable_scan:
          name: "Processing"
          move_interval: 50ms
          scan_width: 3
      # Muted - solid red
      - addressable_lambda:
          name: "Muted"
          update_interval: 100ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(180, 0, 0);
            }
      # Volume display - shows volume level on LEDs
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            float vol = id(speaker_volume).state;
            int leds_to_light = (int)((vol / 100.0f) * it.size() + 0.5f);
            for (int i = 0; i < it.size(); i++) {
              if (i < leds_to_light) {
                // Cyan for normal, orange for high volume
                if (vol > 80) {
                  it[i] = Color(255, 128, 0);  // Orange
                } else {
                  it[i] = Color(0, 200, 200);  // Cyan
                }
              } else {
                it[i] = Color(0, 0, 0);  // Off
              }
            }

# ==============================================================================
# PHYSICAL CONTROLS
# ==============================================================================

# Rotary Encoder (Volume control)
sensor:
  - platform: rotary_encoder
    id: volume_encoder
    name: "Volume Encoder"
    pin_a:
      number: GPIO16
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO18
      mode: INPUT_PULLUP
    resolution: 2
    min_value: 0
    max_value: 100
    publish_initial_value: true
    restore_mode: RESTORE_DEFAULT_ZERO
    on_value:
      then:
        - lambda: |-
            ESP_LOGW("encoder", "Encoder value changed to: %.0f", x);
            float vol = x / 100.0f;
            id(aic3204_dac).set_volume(vol);
            id(speaker_volume).publish_state(x);
        # Show volume on LED ring
        - script.execute: show_volume_on_leds

binary_sensor:
  # Multi-function button (center of dial)
  - platform: gpio
    id: main_button
    name: "Main Button"
    icon: "mdi:gesture-tap-button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_multi_click:
      # Short press: call/answer/hangup
      - timing:
          - ON for at most 1s
          - OFF for at least 50ms
        then:
          - button.press: call_button
      # Long press (>1s): next contact
      - timing:
          - ON for at least 1s
        then:
          - button.press: next_contact_button

  # Hardware mute switch
  - platform: gpio
    id: mute_switch
    name: "Mute Switch"
    icon: "mdi:microphone-off"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: false
    on_press:
      then:
        - switch.turn_on: mic_mute_switch
        - light.turn_on:
            id: status_led
            effect: "Muted"
    on_release:
      then:
        - switch.turn_off: mic_mute_switch
        - lambda: |-
            // Restore appropriate LED state based on call_state
            if (id(call_state) == 0) {
              auto call = id(status_led).turn_off();
              call.perform();
            } else if (id(call_state) == 3) {
              auto call = id(status_led).turn_on();
              call.set_effect("In Call");
              call.perform();
            }

# ==============================================================================
# NUMBER CONTROLS
# ==============================================================================
number:
  # Speaker volume (exposed to HA)
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          float vol = x / 100.0f;
          id(aic3204_dac).set_volume(vol);
          // Sync rotary encoder display
          id(volume_encoder).publish_state(x);

  # Microphone gain (software amplification)
  - platform: template
    id: mic_gain
    name: "Microphone Gain"
    icon: "mdi:microphone"
    min_value: 1
    max_value: 16
    step: 1
    initial_value: 4
    optimistic: true
    restore_value: true
    set_action:
      - lambda: 'id(intercom).set_mic_gain((int)x);'

# ==============================================================================
# SWITCH CONTROLS
# ==============================================================================
switch:
  # LED ring power enable
  - platform: gpio
    id: led_power_switch
    name: "LED Power"
    icon: "mdi:led-on"
    pin: GPIO45
    restore_mode: ALWAYS_ON

  # Speaker amplifier enable (for testing)
  - platform: output
    name: "Speaker Amp Test"
    id: speaker_amp_test
    output: speaker_enable_pin
    icon: "mdi:amplifier"

  # Microphone mute (software, separate from hardware switch)
  # The intercom_audio component checks this state to decide whether to send audio
  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
