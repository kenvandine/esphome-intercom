# ==============================================================================
# NUMBER CONTROLS
# ==============================================================================
number:
  # Speaker volume with ES8311 integration
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          float vol = 0.15 + (x / 100.0) * 0.60;
          id(es8311_dac).set_volume(vol);

  # Microphone gain (amplification during 32->16 bit conversion)
  - platform: template
    id: mic_gain
    name: "Microphone Gain"
    icon: "mdi:microphone"
    min_value: 1
    max_value: 16
    step: 1
    initial_value: 4
    optimistic: true
    restore_value: true
    set_action:
      - lambda: 'id(intercom).set_mic_gain((int)x);'

# ==============================================================================
# FONTS (for display)
# Larger fonts for the bigger display
# ==============================================================================
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 32
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_state
    size: 36
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_info
    size: 24
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: font_debug
    size: 16

# ==============================================================================
# COLORS (for AMOLED display)
# Pure black background for AMOLED power savings
# ==============================================================================
color:
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  - id: color_red
    red: 100%
    green: 20%
    blue: 20%
  - id: color_green
    red: 20%
    green: 100%
    blue: 20%
  - id: color_blue
    red: 20%
    green: 60%
    blue: 100%
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 20%
  - id: color_orange
    red: 100%
    green: 60%
    blue: 0%
  - id: color_cyan
    red: 0%
    green: 100%
    blue: 100%
