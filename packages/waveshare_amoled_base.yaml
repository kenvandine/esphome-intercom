# ==============================================================================
# WAVESHARE AMOLED BASE PACKAGE
# ==============================================================================
# Hardware-specific configuration for Waveshare ESP32-S3-Touch-AMOLED-1.8.
#
# Hardware:
#   - ESP32-S3 (16MB Flash, 8MB PSRAM)
#   - ES8311 Audio Codec (I2S duplex on single bus)
#   - 1.8" AMOLED Display (368x448, SH8601 controller, QSPI)
#   - FT3168 Capacitive Touch Controller
#   - Built-in microphone and speaker
#
# This device uses the i2s_audio_duplex component for full-duplex audio
# on a single I2S bus (same as Xiaozhi Ball V3).
#
# ==============================================================================

# ==============================================================================
# I2C BUS (for ES8311 codec, touch controller, and GPIO expander)
# ==============================================================================
i2c:
  id: i2c_bus
  sda: GPIO15
  scl: GPIO14
  scan: true
  frequency: 100kHz
  timeout: 100ms

# ==============================================================================
# TCA9554 GPIO EXPANDER (controls display/touch power)
# ==============================================================================
pca9554:
  - id: tca9554_exp
    address: 0x20

# GPIO switches from expander to enable display/touch power
# Pins 0, 1, 2, 6 must be HIGH to power display and touch
switch:
  - platform: gpio
    id: exp_pin0
    pin:
      pca9554: tca9554_exp
      number: 0
      mode: output
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: exp_pin1
    pin:
      pca9554: tca9554_exp
      number: 1
      mode: output
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: exp_pin2
    pin:
      pca9554: tca9554_exp
      number: 2
      mode: output
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: exp_pin6
    pin:
      pca9554: tca9554_exp
      number: 6
      mode: output
    restore_mode: ALWAYS_ON
    internal: true
  # Echo cancellation toggle
  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    aec:
      name: "Echo Cancellation"
      icon: "mdi:ear-hearing"

# Script to enable speaker for ringtone (extends base)
script:
  - id: !extend enable_speaker_for_ringtone
    then:
      - output.turn_on: speaker_enable

# Other outputs
output:
  # Speaker amplifier enable
  - platform: gpio
    id: speaker_enable
    pin: GPIO46
  # Display backlight
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 1000Hz
  # Virtual status LED output
  - platform: template
    id: status_led_output
    type: binary
    write_action:
      - lambda: |-
          // Virtual output - status shown on display instead
          ESP_LOGV("status", "Status LED: %s", state ? "ON" : "OFF");

# ==============================================================================
# AUDIO CODEC (ES8311)
# ==============================================================================
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

# ==============================================================================
# ECHO CANCELLATION
# ==============================================================================
esp_aec:
  id: aec_component
  sample_rate: 16000
  filter_length: 4

# ==============================================================================
# I2S AUDIO DUPLEX (single bus for ES8311)
# ES8311 shares I2S bus for both mic and speaker
# ==============================================================================
i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO42
  i2s_din_pin: GPIO10   # Mic data from ES8311
  i2s_dout_pin: GPIO8   # Speaker data to ES8311
  sample_rate: 16000
  aec_id: aec_component

# ==============================================================================
# DISPLAY (SH8601 QSPI AMOLED 368x448)
# ==============================================================================
spi:
  - id: qspi_bus
    type: quad
    clk_pin: GPIO11
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# Display is defined in the main device YAML file
# since pages need device-specific content

# ==============================================================================
# TOUCHSCREEN (FT3168) - DISABLED: Touch controller not responding on I2C
# The FT3168 is not appearing at expected addresses (0x38, 0x14, 0x5D)
# May need hardware investigation or different reset sequence
# ==============================================================================
# touchscreen:
#   - platform: ft5x06
#     id: touch_screen
#     address: 0x38
#     interrupt_pin: GPIO21
#     on_touch:
#       - lambda: |-
#           ESP_LOGW("touch", "Touch at (%d, %d)", touch.x, touch.y);

# ==============================================================================
# DISPLAY BACKLIGHT
# ==============================================================================
light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    icon: "mdi:brightness-6"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# ==============================================================================
# STATUS LED (optional - check if device has one)
# Using display backlight flash as status indicator if no dedicated LED
# ==============================================================================
  # Note: Waveshare AMOLED doesn't have a dedicated status LED
  # Status is shown on the display instead

# Dummy status_led light for compatibility with intercom_base.yaml
# This creates a virtual light that doesn't control real hardware
  - platform: binary
    id: status_led
    name: "Status LED (Virtual)"
    output: status_led_output
    internal: true
    effects:
      - strobe:
          name: "Ringing"
          colors:
            - state: true
              duration: 300ms
            - state: false
              duration: 300ms
      - strobe:
          name: "Calling"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms

