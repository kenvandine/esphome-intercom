# ==============================================================================
# ESP32-S3 INTERCOM - Home Assistant Voice Preview Edition
# ==============================================================================
#
# Full-featured intercom device using the Nabu Casa Voice PE hardware.
# Uses XMOS XU316 for hardware echo cancellation and noise suppression,
# with AIC3204 DAC for high-quality audio output.
#
# This configuration uses ESPHome's standard microphone and speaker
# components (not i2s_audio_duplex) since Voice PE has SEPARATE I2S
# buses for input and output.
#
# HARDWARE:
#   - Board: ESP32-S3 (16MB Flash, 8MB Octal PSRAM)
#   - Audio Processor: XMOS XU316 (AEC, noise suppression, AGC)
#   - Audio DAC: TI AIC3204
#   - Microphones: Dual far-field (stereo, processed by XMOS)
#   - LED: 12-piece RGB LED ring (WS2812)
#   - Controls: Rotary encoder, main button, hardware mute switch
#
# KEY FEATURES:
#   - Hardware echo cancellation (XMOS) - no software AEC needed
#   - Separate I2S buses (ESP32 is slave for mic, master for speaker)
#   - 12-LED ring for visual feedback
#   - Physical volume control via rotary encoder
#   - Hardware mute switch
#
# ==============================================================================

substitutions:
  name: intercom-kitchen
  friendly_name: Hermes - Kitchen
  p2p_port: "12345"
  signaling_port: "12350"
  signaling_broadcast: "192.168.1.255"

# Include shared configurations
packages:
  voice_pe: !include packages/voice_pe_base.yaml
  base: !include packages/intercom_base.yaml

# ==============================================================================
# CONTACTS - Configure your contacts here
# Format: "Name|IP" - First entry should be HomeAssistant
# ==============================================================================
globals:
  - id: static_contacts
    type: std::array<const char*, 8>
    restore_value: no
    initial_value: '{
      "HomeAssistant|192.168.1.23",
      "Office|192.168.1.50",
      "Living Room|192.168.1.51",
      "",
      "",
      "",
      "",
      ""
    }'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.flash_size: 16MB
  on_boot:
    - priority: 600
      then:
        # Wait for XMOS to initialize
        - delay: 3s
        - lambda: |-
            // Extract HA IP from static_contacts[0] (format: "Name|IP")
            if (id(static_contacts)[0] && id(static_contacts)[0][0]) {
              std::string entry = id(static_contacts)[0];
              size_t sep = entry.find('|');
              if (sep != std::string::npos) {
                id(ha_ip) = entry.substr(sep + 1);
              }
            }
            // Restore speaker volume from saved state
            float vol = id(speaker_volume).state / 100.0f;
            id(spk_aic3204).set_volume(vol);
            // Restore mic gain from saved state
            id(intercom).set_mic_gain((int)id(mic_gain).state);
        # Resolve first contact at boot
        - script.execute: resolve_selected_contact
        # Initialize LED ring
        - script.execute: init_led_ring

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# CONNECTIVITY
# ==============================================================================
api:
  id: api_server

ota:
  - platform: esphome

web_server:
  port: 80

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.52
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  ap:
    ssid: "${name} Fallback"

mdns:
  services:
    - service: "_intercom"
      protocol: "_udp"
      port: ${p2p_port}
      txt:
        device: ${name}

# ==============================================================================
# EXTERNAL COMPONENTS - Intercom specific
# ==============================================================================
external_components:
  - source:
      type: local
      path: components
    components: [intercom_audio, mdns_discovery]
  # Note: voice_kit component is loaded from voice_pe_base.yaml package

# ==============================================================================
# INTERCOM AUDIO
# Uses ESPHome's standard microphone and speaker components
# NO AEC needed - XMOS handles echo cancellation in hardware
# ==============================================================================
intercom_audio:
  id: intercom
  microphone_id: mic_xmos
  speaker_id: spk_aic3204
  # No aec_id - XMOS handles echo cancellation in hardware
  listen_port: ${p2p_port}
  remote_ip: !lambda 'return id(selected_ip).state;'
  remote_port: !lambda 'return (uint16_t)id(selected_port).state;'
  buffer_size: 8192
  prebuffer_size: 2048
  on_start:
    - output.turn_on: speaker_enable_pin
    - lambda: 'id(call_state) = 3;'
    - component.update: call_state_text
    - light.turn_on:
        id: status_led
        effect: "In Call"
  on_stop:
    - output.turn_off: speaker_enable_pin
    - lambda: |-
        if (id(call_state) == 3) {
          std::string peer_ip = id(selected_ip).state;
          if (!peer_ip.empty() && peer_ip != id(ha_ip)) {
            auto ips = wifi::global_wifi_component->get_ip_addresses();
            std::string our_ip = ips.empty() ? "" : ips[0].str();
            id(signaling_msg) = "HANGUP:${name}:" + our_ip;
          }
        }
        id(call_state) = 0;
        id(caller_name) = "";
        id(caller_ip) = "";
    - script.execute: flush_signaling
    - script.execute: resolve_selected_contact
    - component.update: call_state_text
    - light.turn_on:
        id: status_led
        brightness: 30%
        effect: "Breathing Blue"

# ==============================================================================
# mDNS DISCOVERY
# ==============================================================================
mdns_discovery:
  id: discovery
  service_type: "_intercom._udp"
  scan_interval: 30s
  on_peer_found:
    - logger.log:
        format: "Peer found: %s (%s)"
        args: ["name.c_str()", "ip.c_str()"]
  on_peer_lost:
    - logger.log:
        format: "Peer lost: %s"
        args: ["name.c_str()"]

# ==============================================================================
# EXTEND CALL STATE TEXT SENSOR
# Override LED effects when call_state changes
# ==============================================================================
text_sensor:
  - id: !extend call_state_text
    on_value:
      then:
        - lambda: |-
            // Don't access LED until it's initialized
            if (!id(led_initialized)) return;

            switch(id(call_state)) {
              case 0:  // IDLE
                {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(0.3f);
                  call.set_effect("Breathing Blue");
                  call.perform();
                }
                break;
              case 1:  // RINGING_IN
                {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(1.0f);
                  call.set_effect("Ringing Flash");
                  call.perform();
                }
                break;
              case 2:  // RINGING_OUT
                {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(1.0f);
                  call.set_effect("Calling");
                  call.perform();
                }
                break;
              case 3:  // IN_CALL
              case 4:  // ANSWERING
                {
                  auto call = id(status_led).turn_on();
                  call.set_brightness(0.8f);
                  call.set_effect("In Call");
                  call.perform();
                }
                break;
            }

